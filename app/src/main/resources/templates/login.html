<!doctype html>
<html
  lang="ja"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>ログインページ | 課題管理アプリケーション</title>

</head>
<body>

  <!-- エラーメッセージ表示部分 -->
  <div th:if="${param.error}">
    <p class="text-danger">ユーザ名もしくはパスワードが違います</p>
  </div>

  <form action="#" th:action="@{/login}" method="post">
    <div class="mt-3">
      <label for="usernameInput" class="form-label">ユーザ名</label>
      <!-- 'username'はSpring Securityデフォルトのフィールド名 -->
      <input type="text" id="usernameInput" name="username" class="form-control">
    </div>
    <div class="mt-3">
      <label for="passwordInput" class="form-label">パスワード</label>
      <!-- 'password'はSpring Securityデフォルトのフィールド名 -->
      <input type="password" id="passwordInput" name="password" class="form-control">
    </div>
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">ログイン</button>
    </div>
  </form>
</body>
</html>
